name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: selftest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: 环境自检（env_check）
        run: python tools/env_check.py --selftest

      - name: 端到端冒烟（smoke_chain · 含黄金数值断言）
        run: python tools/smoke_chain.py --selftest

      - name: 全部 tools 自检（含 NCA / 房室拟合 / 释放拟合 / 统计管线）
        run: |
          set -e
          for f in tools/*.py; do
            echo "== $f"
            python "$f" --selftest
          done

      - name: 交付门禁脚本元自检（给门禁喂反例，证明可失败）
        run: python scripts/selftest_scripts.py

      - name: 包结构自校验
        run: python scripts/verify_bundle.py --root .
